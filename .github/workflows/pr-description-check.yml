name: Validate Pull Request

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

jobs:
  validate:
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-latest

    steps:
      - name: Check PR description
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";

            const regex = /(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#\d+/i;

            if (!regex.test(body)) {
              core.setFailed(`
              Your pull request must contain a closing keyword.

              Examples:
              Closes #12
              Fixes #5
              Resolves #30
              `);
            }
